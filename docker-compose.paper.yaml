services:
  simulator:
    container_name: simulator
    image: roboticserlangen/simulatorcli:commit-6a4e1c06533b
    restart: unless-stopped
    environment:
      GEOMETRY: "2020"
      REALISM: "RC2021"
    network_mode: host
    logging:
      driver: none

  autoref-tigers:
    container_name: autoref-tigers
    image: tigersmannheim/auto-referee:1.2.0
    restart: unless-stopped
    command:
      - "-a"
      - "-visionAddress"
      - "224.5.23.2:10020"
      - "-refereeAddress"
      - "224.5.23.1:11003"
    logging:
      driver: none
    network_mode: host
    depends_on:
      - simulator

  game-controller:
    container_name: game-controller
    image: robocupssl/ssl-game-controller:3.9.0
    command:
      - "-visionAddress"
      - "224.5.23.2:10020"
      - "-trackerAddress"
      - "224.5.23.2:11010"
      - "-publishAddress"
      - "224.5.23.1:11003"
      - "-address"
      - ":8081"
    restart: unless-stopped
    ports:
      - 8081/tcp
    logging:
      driver: none
    network_mode: host
    depends_on:
      - autoref-tigers

  ssl-vision-client:
    container_name: ssl-vision-client
    image: robocupssl/ssl-vision-client:1.7.3
    command:
      - "-visionAddress"
      - "224.5.23.2:10020"
    restart: unless-stopped
    ports:
      - 8082/tcp
      - 8082:8082
    logging:
      driver: none
    network_mode: host
    depends_on:
      - game-controller

  gateway:
    container_name: gateway
    build:
      context: .
      dockerfile: gateway/gateway-augusto/gateway-augusto.Dockerfile
    environment:
      - VISION_ADDRESS="224.5.23.2:10020"
      - TRACKED_ADDRESS="224.5.23.2:11010"
      - GC_ADDRESS="224.5.23.1:11003"
      - INTERCEPT=true
      - WAIT_PACKAGES=100
      - MEASURE_PACKAGES=100
    volumes:
      - .ssl-core:/tmp/.ssl-core
    network_mode: host
    depends_on:
      - game-controller

  perception-ms:
    container_name: perception-ms
    image: robocin/perception-brutus:manual-c7208b
    volumes:
      - .ssl-core:/tmp/.ssl-core
    depends_on:
      - gateway
    network_mode: host

  referee-ms:
    container_name: referee-ms
    image: robocin/referee-daronco:manual-419128
    volumes:
      - .ssl-core:/tmp/.ssl-core
    depends_on:
      - perception-ms
    network_mode: host

  playback-db:
    container_name: playback-db
    image: "redis:latest"
    network_mode: host

  playback-ms:
    container_name: playback-ms
    build:
      context: .
      dockerfile: playback-ms/playback-caze/playback-caze.Dockerfile
    volumes:
      - .ssl-core:/tmp/.ssl-core
    depends_on:
      - referee-ms
      - playback-db
    network_mode: host
    extra_hosts:
      - "playback-db:127.0.0.1"

volumes:
  .ssl-core: